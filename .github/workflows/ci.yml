name: CI & Linter Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Plugin Imports
        run: |
          node -e "import('./index.js').then(m => console.log('✅ Plugin successfully loaded:', m.name))"

      - name: Run ASD-STE100 Linter on Documentation
        run: |
          python scripts/ste_linter.py SKILL.md
